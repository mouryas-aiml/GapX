[project]
name = "gapx"
version = "0.1.0"
description = "AI-powered retail shelf intelligence for empty-shelf detection, stockout alerts, product placement monitoring, and planogram compliance scoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "plotly>=5.22",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "gradio>=4.0",
    "typer>=0.12",
    "streamlit>=1.36",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[tool.uv]
# Broken ujson wheel on Windows boxes without msvcp140.dll.
override-dependencies = ["ujson; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelfsight"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that download data or hit external services",
]

[tool.coverage.run]
source = ["src/shelfsight"]
