<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="40%" stop-color="#0a1329"/>
      <stop offset="100%" stop-color="#070c1e"/>
    </linearGradient>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f42" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09142b" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Electric Cyan Ambient Glow Orb -->
  <circle cx="950" cy="200" r="180" fill="#0284c7" opacity="0.18" filter="url(#glow)"/>
  <circle cx="250" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Left Content Block -->
  <g transform="translate(80, 70)">
    <!-- Badge Pill -->
    <rect x="0" y="0" width="270" height="32" rx="16" fill="#0f2757" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <text x="32" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe" letter-spacing="1.5">RETAIL VISION INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Gap<tspan fill="url(#electricGrad)">X</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="142" font-family="'Inter', -apple-system, sans-serif" font-size="21" font-weight="500" fill="#94a3b8">
      AI-Powered Retail Shelf Intelligence &amp; Stockout Prevention
    </text>

    <!-- Value Prop Tags -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="145" height="34" rx="8" fill="#132347" stroke="#1e3a8a"/>
      <text x="14" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ Gap Detection</text>

      <rect x="155" y="0" width="180" height="34" rx="8" fill="#132347" stroke="#1e3a8a"/>
      <text x="170" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🎯 Planogram Audit</text>

      <rect x="345" y="0" width="175" height="34" rx="8" fill="#132347" stroke="#1e3a8a"/>
      <text x="360" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#38bdf8">📊 Restock Signals</text>
    </g>
  </g>

  <!-- Right Visual Shelf Intelligence Graphic Card -->
  <g transform="translate(740, 50)">
    <rect width="380" height="300" rx="24" fill="url(#cardGrad)" stroke="#1e3a8a" stroke-width="2"/>
    <rect width="380" height="300" rx="24" stroke="url(#electricGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Reticle Corners -->
    <path d="M 20 40 L 20 20 L 40 20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 360 40 L 360 20 L 340 20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 260 L 20 280 L 40 280" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 360 260 L 360 280 L 340 280" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Header inside card -->
    <text x="35" y="48" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">STORE #402 — SHELF AUDIT</text>
    <circle cx="335" cy="43" r="6" fill="#22c55e" filter="url(#glow)"/>
    <text x="290" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#86efac">ONLINE</text>

    <!-- Shelf Row 1 -->
    <rect x="35" y="70" width="310" height="80" rx="8" fill="#081024" stroke="#1e293b"/>
    <rect x="45" y="80" width="55" height="60" rx="6" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="52" y="115" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Brand A</text>
    <rect x="110" y="80" width="55" height="60" rx="6" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="117" y="115" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Brand A</text>

    <!-- Empty GAP Detected -->
    <rect x="175" y="80" width="70" height="60" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="187" y="112" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#f87171">OOS GAP</text>
    <text x="195" y="125" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#fca5a5">Restock!</text>

    <rect x="255" y="80" width="55" height="60" rx="6" fill="#22c55e" stroke="#4ade80" stroke-width="1.5"/>
    <text x="262" y="115" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Brand B</text>

    <!-- Shelf Row 2 -->
    <rect x="35" y="165" width="310" height="80" rx="8" fill="#081024" stroke="#1e293b"/>
    <rect x="45" y="175" width="55" height="60" rx="6" fill="#f97316" stroke="#fb923c" stroke-width="1.5"/>
    <text x="52" y="210" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Brand C</text>
    <rect x="110" y="175" width="55" height="60" rx="6" fill="#f97316" stroke="#fb923c" stroke-width="1.5"/>
    <text x="117" y="210" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Brand C</text>
    <rect x="175" y="175" width="55" height="60" rx="6" fill="#e11d48" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="182" y="210" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Brand D</text>
    <rect x="240" y="175" width="55" height="60" rx="6" fill="#e11d48" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="247" y="210" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Brand D</text>

    <!-- Live Telemetry Footer inside Card -->
    <g transform="translate(35, 260)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Compliance: <tspan fill="#38bdf8" font-weight="700">92%</tspan></text>
      <text x="120" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Gaps: <tspan fill="#f87171" font-weight="700">1 Detected</tspan></text>
      <text x="235" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Latency: <tspan fill="#4ade80" font-weight="700">12ms</tspan></text>
    </g>
  </g>
</svg>