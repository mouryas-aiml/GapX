<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <linearGradient id="gxBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f1f42"/>
      <stop offset="100%" stop-color="#060c1c"/>
    </linearGradient>
    <linearGradient id="gxCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gxElectricGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gxGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="gxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Neon Border -->
  <rect x="8" y="8" width="224" height="224" rx="52" fill="url(#gxBgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="8" y="8" width="224" height="224" rx="52" stroke="url(#gxCyanGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Computer Vision Sensor Grid Background -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
    <line x1="44" y1="84" x2="196" y2="84" stroke-dasharray="3 3"/>
    <line x1="44" y1="120" x2="196" y2="120" stroke-dasharray="3 3"/>
    <line x1="44" y1="156" x2="196" y2="156" stroke-dasharray="3 3"/>
    <line x1="84" y1="44" x2="84" y2="196" stroke-dasharray="3 3"/>
    <line x1="120" y1="44" x2="120" y2="196" stroke-dasharray="3 3"/>
    <line x1="156" y1="44" x2="156" y2="196" stroke-dasharray="3 3"/>
  </g>

  <!-- Shelf Rack Layers (3 Rows) -->
  <rect x="42" y="88" width="156" height="5" rx="2.5" fill="#1e3a8a" opacity="0.7"/>
  <rect x="42" y="142" width="156" height="5" rx="2.5" fill="#1e3a8a" opacity="0.7"/>
  <rect x="42" y="194" width="156" height="6" rx="3" fill="#38bdf8" opacity="0.9" filter="url(#gxGlow)"/>

  <!-- Shelf Products on Lower Row -->
  <rect x="48" y="152" width="22" height="38" rx="4" fill="#0284c7" opacity="0.85"/>
  <rect x="74" y="148" width="22" height="42" rx="4" fill="#38bdf8" opacity="0.95"/>
  
  <!-- The Detected GAP (Stockout Target Zone) -->
  <rect x="100" y="148" width="40" height="42" rx="5" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="120" cy="169" r="3.5" fill="#f43f5e"/>

  <!-- Products continuing -->
  <rect x="144" y="150" width="22" height="40" rx="4" fill="#0ea5e9" opacity="0.9"/>
  <rect x="170" y="154" width="22" height="36" rx="4" fill="#0284c7" opacity="0.85"/>

  <!-- Upper Focal Reticle Aperture & Vision Eye / Lens -->
  <circle cx="120" cy="80" r="38" stroke="url(#gxElectricGrad)" stroke-width="3" stroke-dasharray="4 2" fill="none" opacity="0.85"/>
  <circle cx="120" cy="80" r="24" stroke="#38bdf8" stroke-width="2.5" fill="#071228" fill-opacity="0.8"/>
  <circle cx="120" cy="80" r="10" fill="url(#gxCyanGrad)" filter="url(#gxGlow)"/>

  <!-- AI Focus Corner Crosshairs -->
  <path d="M 40 56 L 40 40 L 56 40" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 200 56 L 200 40 L 184 40" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 40 184 L 40 200 L 56 200" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 200 184 L 200 200 L 184 200" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Central "X" Precision Target Beam -->
  <path d="M 112 72 L 128 88" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 128 72 L 112 88" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
</svg>