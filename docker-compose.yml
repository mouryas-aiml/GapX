services:
  api:
    build: .
    env_file: .env
    ports:
      - "8210:8000"
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: http://localhost:8210
    ports:
      - "5173:80"
    depends_on:
      - api
